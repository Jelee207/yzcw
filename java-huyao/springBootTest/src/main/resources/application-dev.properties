# 开发环境配置
server.port=8081

# ============ 数据源（MySQL，root/123456） ============
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/huyao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ============ MyBatis-Plus 配置 ============
# 实体类所在包
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# mapper 映射文件位置（本项目用注解/内置方法，无需 xml）
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
# 驼峰命名自动转换（表字段 user_name -> 实体 userName）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键策略：数据库自增
mybatis-plus.global-config.db-config.id-type=auto
# SQL 日志输出
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============ 苦情树相册 · 后台管理接口令牌 ============
# 未来的后台管理系统调用 /api/admin/couples/** 时，请求头带 X-Admin-Token: <此值>
# 留空或不配置则后台写接口一律拒绝；正式使用时请改成自己的长随机串
huyao.admin.token=huyao-admin-2026
